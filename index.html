<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SevillaConference – 11EWICS2026</title>
    <meta http-equiv="refresh" content="0; url=maps/" />
    <style>
      :root {
        --bg: #eef1f3;
        --panel-solid: #ffffff;
        --glass-border: rgba(20, 24, 28, 0.1);
        --text: #14181d;
        --text-muted: #5a6472;
        --amber: #e2a33f;
        --amber-ink-dark: #2a1c04;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0c0f;
          --panel-solid: #14181d;
          --glass-border: rgba(255, 255, 255, 0.16);
          --text: #edf1f3;
          --text-muted: #9aa5b1;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        background: var(--panel-solid);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 32px 36px;
        max-width: 420px;
        text-align: center;
      }
      h1 { font-size: 1.3rem; margin: 0 0 8px; }
      p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; margin: 0 0 20px; }
      a.primary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 18px;
        border-radius: 8px;
        background: var(--amber);
        color: var(--amber-ink-dark);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>SevillaConference · 11EWICS2026</h1>
      <p>Redirecting to the interactive maps…</p>
      <a class="primary" href="maps/">Open interactive maps →</a>
    </div>
  </body>
</html>
